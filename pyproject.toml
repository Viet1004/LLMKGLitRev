[project]
name = "LLMKGLitRev"
version = "0.0.1"
description = "This is a paper idea for using LLMs and Knowledge Graph to aid Literature Review"
authors = [{ name = "TiefX", email = "nguyenquocviet1004@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # "arxiv-mcp-server[test]",  # Disabled for Streamlit Cloud - local workspace only
    "boto3>=1.40.17",
    "pybliometrics==4.4.1",
    "pycurl>=7.45.1",  # Required for IEEE Xplore API (xploreapi SDK)
    "certifi>=2024.0.0",  # SSL certificates for pycurl
    "requests>=2.31.0",  # HTTP library for Semantic Scholar, OpenAlex, CrossRef APIs
    "dspy==3.1.0",
    "arxiv==2.2.0",
    "owlready2==0.49",
    "fastapi>=0.116.1",
    "fastparquet>=2024.11.0",
#    "gradio>=5.39.0",
    "grandalf>=0.8",
    "graphdatascience>=0.1.0",
    "ipykernel>=6.30.0",
    "kg-gen>=0.1.6",
    "langchain>=0.3.27",
    "streamlit>=1.32.0",
    "langchain-anthropic>=0.3.19",
    "langchain-aws>=0.2.31",
    "langchain-huggingface>=0.3.1",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=0.3.32",
    "langgraph>=0.6.6",
    "matplotlib>=3.7.0",
    "mcp[cli]>=1.12.2",
    "neo4j>=4.4.2,<5.0",
    "networkx>=3.0",
    "plotly>=5.18.0",
    "pyarrow>=21.0.0",
#    "qdrant-client>=1.16.0",
#    "smolagents>=1.20.0",
    "tavily-python>=0.7.11",
    "transformers>=4.54.0",
    "langchain-deepseek>=0.1.4",
    "sentence-transformers>=5.2.0",
    # Document RAG dependencies
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "langchain-community>=0.3.16",
    "faiss-cpu>=1.8.0",
]

[project.urls]
Homepage = "https://Viet1004.github.io/LLMKGLitRev/"
Repository = "https://github.com/Viet1004/LLMKGLitRev"
Documentation = "https://Viet1004.github.io/LLMKGLitRev/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "docling>=2.42.2",
    "mypy>=0.991",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkglitrev"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "src/llmkglitrev/MCPServer/arxiv-mcp-server/"
]
# Ignore specific untyped libraries
[[tool.mypy.overrides]]
module = [
    "smolagents",
    "smolagents.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

